name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Copy-Item target\release\litedock.exe installer\LiteDock.exe
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\litedock.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: LiteDock-Setup
          path: installer/LiteDock-Setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/LiteDock-Setup-*.exe
